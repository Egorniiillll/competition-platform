services:
  postgres:
    image: postgres:16
    container_name: competition-postgres
    environment:
      POSTGRES_DB: competition_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./competition-platform
      dockerfile: Dockerfile
    container_name: competition-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/competition_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontedforcompetition
      dockerfile: Dockerfile
    container_name: competition-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: